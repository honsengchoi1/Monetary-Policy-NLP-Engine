name: FOMC Pipeline Automation

on:
  schedule:
    # Summer / EDT (UTC-4): 2:01, 2:05, and 2:15 PM EDT every Wednesday
    - cron: '1,5,15 18 * * 3'
    # Winter / EST (UTC-5): 2:01, 2:05, and 2:15 PM EST every Wednesday
    - cron: '1,5,15 19 * * 3'
  workflow_dispatch: # This allows us to click a button and run it right now!

concurrency:
  group: fomc-pipeline
  cancel-in-progress: false

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Scraper Pipeline
        run: python src/data_pipeline.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated data sync: FOMC Ledger" && git push)
